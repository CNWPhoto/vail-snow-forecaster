# ---------------------------------------------------------------------------
# Zones. DRAFT, to be corrected by someone who skis the mountain.
#
# Each zone is seeded by the mapped trails named here. Every cell inside the
# ski-area boundary is then given to the zone whose seed trails it drains
# toward without crossing a ridge. Trails not listed do not seed anything and
# are absorbed by whichever zone surrounds them. To move a boundary, move a
# trail name from one zone to another or add one. Names must match
# OpenStreetMap exactly (including its spellings, e.g. "Genghis Kahn").
# `lifts` are for reference and later wind-hold logic; they do not seed.
# ---------------------------------------------------------------------------

[[zones]]
id = "lionshead"
name = "Lionshead / Born Free"
group = "Front Side"
lifts = ["Eagle Bahn Gondola", "Born Free Express Lift", "Pride Express Lift", "Cascade Village Lift"]
