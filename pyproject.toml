[project]
name = "vailsnow"
version = "0.1.0"
description = "Zone-level, terrain-aware snowfall forecast for Vail Mountain"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "rasterio>=1.4",
    "pyproj>=3.6",
    "shapely>=2.0",
    "pillow>=10.0",
    "requests>=2.31",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "numcodecs>=0.17.1",
    "eccodes>=2.50.1",
    "eccodeslib>=2.50.0.34",
    "scikit-learn>=1.9.1",
    "contourpy>=1.4.0",
    "joblib>=1.6.0",
]

[project.scripts]
vailsnow = "vailsnow.cli:main"

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vailsnow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["data: needs the real terrain data on disk"]
