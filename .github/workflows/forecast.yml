# Builds and publishes the forecast on GitHub's computers, so nothing has to run at home.
#
#   main      code and this file
#   gh-pages  the published map and forecast files (one commit, replaced each run, so it never grows)
#   state     the forecast logs behind the scorecard, and alert state (small text files, history kept)
#
# The models and terrain the jobs need (about 110 MB) are a release asset named by RUNTIME_TAG.
# Times are UTC and follow when the public model files appear, so they need no daylight-saving change.
name: Forecast jobs

on:
  schedule:
    - cron: "50 17 * * *"       # daily map: the 12z HRRR, GEFS and the Blend are out by 17:45
    - cron: "55 5,11,23 * * *"  # 10-day outlook after the 00z, 06z and 18z ensemble runs
    - cron: "15 20 * * *"       # 10-day outlook again once the afternoon Blend is out
    - cron: "45 4 * * *"        # evening alert (9:45 pm Mountain Standard Time)
    - cron: "5 12 * * *"        # 5 am alert: what the gauge measured overnight
  workflow_dispatch:
    inputs:
      job:
        description: Which job to run
        type: choice
        options: [outlook, forecast, evening, morning, score]
        default: outlook

permissions:
  contents: write

concurrency:
  group: vailsnow-publish
  cancel-in-progress: false

env:
  RUNTIME_TAG: runtime-v1

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { ref: gh-pages, path: site }
      - uses: actions/checkout@v4
        with: { ref: state, path: state }

      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install uv

      - name: Reuse installed packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      - run: uv sync --frozen --no-dev

      - name: Reuse the models and terrain
        id: runtime
        uses: actions/cache@v4
        with:
          path: runtime
          key: ${{ env.RUNTIME_TAG }}
      - name: Download the models and terrain
        if: steps.runtime.outputs.cache-hit != 'true'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release download "$RUNTIME_TAG" --pattern runtime.tar.gz
          mkdir -p runtime && tar -xzf runtime.tar.gz -C runtime && rm runtime.tar.gz

      - name: Reuse finished gauge years and recent snow-model windows
        uses: actions/cache@v4
        with:
          path: |
            cache/snotel
            cache/snodas_live
          key: downloads-${{ github.run_id }}
          restore-keys: downloads-

      - name: Pick the job
        id: pick
        run: |
          case "${{ github.event.schedule }}" in
            "50 17 * * *") job=forecast ;;
            "45 4 * * *")  job=evening ;;
            "5 12 * * *")  job=morning ;;
            *)             job=outlook ;;
          esac
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then job="${{ inputs.job }}"; fi
          echo "job=$job" >> "$GITHUB_OUTPUT"

      - name: Run it
        run: |
          # the logs and alert state live on the state branch; the day's snow-per-inch field rides with the site
          mkdir -p state/log state/alerts site/live site/data
          for pair in log:state/log alerts:state/alerts live:site/live; do
            rm -rf "runtime/${pair%%:*}" && ln -s "$PWD/${pair#*:}" "runtime/${pair%%:*}"
          done
          export VAILSNOW_DATA_DIR="$PWD/runtime" VAILSNOW_CACHE_DIR="$PWD/cache" VAILSNOW_WEB_DATA_DIR="$PWD/site/data"
          case "${{ steps.pick.outputs.job }}" in
            forecast) uv run --no-sync vailsnow forecast ;;
            outlook)  uv run --no-sync vailsnow outlook ;;
            evening)  uv run --no-sync vailsnow alert evening ;;
            morning)  uv run --no-sync vailsnow alert morning ;;
            score)    uv run --no-sync vailsnow score --no-replay ;;
          esac
          uv run --no-sync vailsnow status | head -6

      - name: Save the logs
        run: |
          cd state
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -q -m "${{ steps.pick.outputs.job }} $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q origin HEAD:state

      - name: Publish the map and forecast files
        run: |
          cp web/app/index.html web/app/app.js web/app/app.css site/
          rm -rf site/static && cp -R web/app/static site/static
          touch site/.nojekyll
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan publish
          git add -A
          git commit -q -m "Forecast files $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f origin publish:gh-pages
